name: Auto Renew Free Fire Tokens

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Cấp quyền ghi mã nguồn trực tiếp cho job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4   # Cập nhật lên v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Token Generator Script
        run: python reg_tokens.py

      - name: Commit and Push Updated tokens.txt
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tokens.txt
          git commit -m "Auto update fresh Free Fire tokens [skip ci]" || exit 0
          git push
