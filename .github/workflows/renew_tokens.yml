name: Auto Renew Free Fire Tokens

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Bắt buộc phải có quyền ghi nội dung

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Token Generator Script
        run: python reg_tokens.py

      - name: Commit and Push Updated tokens.txt
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update fresh Free Fire tokens [skip ci]"
          file_pattern: "tokens.txt"
