name: Auto Renew Free Fire Tokens

on:
  schedule:
    # Tự động chạy lúc 00:00 UTC (07:00 sáng VN) mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép kích hoạt chạy bằng tay

jobs:
  renew-tokens:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Token Generator Script
        run: python reg_tokens.py

      - name: Commit and Push Updated tokens.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add tokens.txt
          git commit -m "Auto update fresh Free Fire tokens [skip ci]" || exit 0
          git push
